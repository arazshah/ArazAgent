services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    env_file: .env
    environment:
      TZ: Asia/Tehran
    expose:
      - "8000"
    volumes:
      - audio_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Do NOT publish a host port here (no top-level "ports:"). Coolify's
    # reverse proxy reaches the container over the internal "coolify"
    # network using the port declared above via `expose`; binding the same
    # host port directly, as this file used to, collides with any other
    # Coolify-managed service that also wants host port 8000. Set the
    # public domain (agent.araz.me) and container port (8000) from the
    # Coolify resource UI. Coolify's SERVICE_FQDN_* magic env vars are
    # version-dependent — the UI is the reliable path, not the line below.
    # SERVICE_FQDN_APP_8000=agent.araz.me

  # Switching to Coolify's managed Postgres: drop this service and point
  # DATABASE_URL (in .env) at the managed instance instead.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: araz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: araz_agent
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U araz -d araz_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  # Holds voice note audio. Losing this volume loses every voice note's
  # source audio permanently — back it up (see README).
  audio_data:
  db_data:
